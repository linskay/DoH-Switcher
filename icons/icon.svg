<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circuit traces & nodes -->
  <g stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" fill="#00E5FF" filter="url(#cyanGlow)">
    <!-- Top Left -->
    <line x1="18" y1="36" x2="34" y2="36" />
    <circle cx="17" cy="36" r="4.5" />

    <!-- Top Right -->
    <line x1="94" y1="36" x2="110" y2="36" />
    <circle cx="111" cy="36" r="4.5" />

    <!-- Lower Left -->
    <line x1="16" y1="72" x2="30" y2="72" />
    <circle cx="15" cy="72" r="4.5" />

    <!-- Lower Right -->
    <line x1="98" y1="72" x2="112" y2="72" />
    <circle cx="113" cy="72" r="4.5" />

    <!-- Bottom Node -->
    <line x1="64" y1="112" x2="64" y2="122" />
    <circle cx="64" cy="122" r="4.5" />
  </g>

  <!-- Shield Shape -->
  <path d="M 64,14 C 78,14 94,18 102,24 C 102,68 86,95 64,112 C 42,95 26,68 26,24 C 34,18 50,14 64,14 Z"
        fill="url(#shieldGrad)"
        stroke="#40C4FF"
        stroke-width="4"
        stroke-linejoin="round" />

  <!-- Inner bottom shield circuit -->
  <path d="M 42,92 L 64,98 L 86,92" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round" />

  <!-- Padlock Shackle -->
  <path d="M 50,58 L 50,52 C 50,38 78,38 78,52 L 78,58"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5.5"
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="42" y="56" width="44" height="34" rx="6"
        fill="#00E5FF"
        stroke="#FFFFFF"
        stroke-width="2" />

  <!-- Padlock Keyhole -->
  <circle cx="64" cy="67.5" r="3.5" fill="#0D47A1" />
  <polygon points="62.5,68 65.5,68 66.5,77 61.5,77" fill="#0D47A1" />
</svg>
