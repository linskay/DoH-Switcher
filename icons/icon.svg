<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#fcee0a" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="4" y="4" width="120" height="120" rx="18" fill="#0b0d14" stroke="#fcee0a" stroke-width="5" />
  
  <!-- Cyberpunk Top Right Notch -->
  <polygon points="76,4 110,4 124,18 124,36 94,4" fill="#ff003c" />

  <!-- Shield Frame -->
  <polygon points="64,26 98,42 98,74 64,102 30,74 30,42" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#neon-glow)" />

  <!-- Data Stream Beam -->
  <line x1="64" y1="68" x2="64" y2="88" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />

  <!-- Central Core Node -->
  <circle cx="64" cy="50" r="11" fill="#fcee0a" stroke="#00f0ff" stroke-width="3" filter="url(#neon-glow)" />
</svg>
