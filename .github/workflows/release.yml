name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build extension zip
        run: |
          mkdir -p dist/stage/icons
          cp manifest.json background.js popup.html popup.css popup.js README.md LICENSE dist/stage/
          cp -r icons/* dist/stage/icons/
          cd dist/stage
          zip -r ../DoH-Switcher-v1.0.0.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DoH-Switcher-v1.0.0.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
